<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantUML Preview</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            font-family: var(--vscode-font-family);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background-color: var(--vscode-titleBar-activeBackground);
            border-bottom: 1px solid var(--vscode-panel-border);
            flex-shrink: 0;
        }

        .toolbar button {
            padding: 4px 12px;
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: 1px solid var(--vscode-button-border);
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--vscode-font-family);
        }

        .toolbar button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }

        .toolbar button:active {
            opacity: 0.8;
        }

        .toolbar .separator {
            width: 1px;
            height: 20px;
            background-color: var(--vscode-panel-border);
            margin: 0 4px;
        }

        .content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
            margin-right: 0;
            /* Sidebar is collapsed by default; JS adds margin when open */
            transition: margin-right 0.2s ease;
        }

        .content-area.journey-open {
            margin-right: 300px;
        }

        .preview-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: var(--vscode-editor-background);
            display: none;
        }

        .preview-container.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
        }

        .svg-wrapper svg {
            display: block;
        }

        .source-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 20px;
            display: none;
            background-color: var(--vscode-editor-background);
        }

        .source-container.active {
            display: block;
        }

        .source-code {
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            line-height: 1.5;
            white-space: pre;
            color: var(--vscode-editor-foreground);
            margin: 0;
        }

        g.entity {
            cursor: pointer;
        }

        g.entity:hover {
            opacity: 0.8;
        }

        g.link {
            cursor: pointer;
        }

        g.link:hover {
            opacity: 0.8;
        }

        .panning {
            cursor: move;
        }

        .panning g.entity,
        .panning g.link {
            cursor: move;
        }

        /* Journey system styles */
        .journey-sidebar {
            position: fixed;
            right: 0;
            top: 41px;
            /* Below toolbar */
            bottom: 0;
            width: 300px;
            background-color: var(--vscode-sideBar-background);
            border-left: 1px solid var(--vscode-panel-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .journey-sidebar.collapsed {
            transform: translateX(300px);
            opacity: 0;
            pointer-events: none;
        }

        #toggleJourney.journey-open {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        .journey-header {
            padding: 12px;
            border-bottom: 1px solid var(--vscode-panel-border);
            font-weight: bold;
            font-size: 13px;
            background-color: var(--vscode-sideBarTitle-background);
            color: var(--vscode-sideBarTitle-foreground);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .journey-header-title {
            flex: 1;
        }

        .journey-header-buttons {
            display: flex;
            gap: 4px;
        }

        .journey-header-button {
            padding: 2px 8px;
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            border: 1px solid var(--vscode-button-border);
            border-radius: 2px;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--vscode-font-family);
        }

        .journey-header-button:hover {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }

        .journey-header-button:active {
            opacity: 0.8;
        }

        .journey-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .journey-item {
            display: flex;
            align-items: flex-start;
            padding: 8px;
            margin-bottom: 4px;
            background-color: var(--vscode-list-activeSelectionBackground);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 3px;
            font-size: 12px;
            word-wrap: break-word;
        }

        .journey-text {
            flex: 1;
            padding-right: 8px;
            color: var(--vscode-list-activeSelectionForeground);
        }

        .journey-delete {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            border: 1px solid var(--vscode-button-border);
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }

        .journey-delete:hover {
            background-color: #ff4444;
            color: white;
        }

        .input-container {
            position: fixed;
            top: 41px;
            /* Below toolbar */
            right: 300px;
            width: 300px;
            padding: 12px;
            background-color: var(--vscode-input-background);
            border-left: 1px solid var(--vscode-panel-border);
            border-bottom: 1px solid var(--vscode-panel-border);
            z-index: 1001;
            display: none;
        }

        .input-container.visible {
            display: block;
        }

        .input-container textarea {
            width: 100%;
            padding: 6px;
            background-color: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
            border-radius: 2px;
            font-family: var(--vscode-font-family);
            font-size: 12px;
            resize: vertical;
        }

        .input-container textarea:focus {
            outline: 1px solid var(--vscode-focusBorder);
        }

        g.entity.selected,
        g.cluster.selected {
            opacity: 0.8;
            filter: drop-shadow(0 0 8px var(--vscode-focusBorder)) drop-shadow(0 0 4px var(--vscode-focusBorder));
            stroke: var(--vscode-focusBorder);
            stroke-width: 3px;
        }

        g.entity.selected *,
        g.cluster.selected * {
            stroke: var(--vscode-focusBorder);
            stroke-width: 2px;
        }

        g.link.selected {
            opacity: 0.8;
            filter: drop-shadow(0 0 8px var(--vscode-focusBorder)) drop-shadow(0 0 4px var(--vscode-focusBorder));
        }

        g.link.selected path {
            stroke: var(--vscode-focusBorder);
            stroke-width: 3px;
        }

        g.link.selected polygon {
            fill: var(--vscode-focusBorder);
        }

        g.selected {
            opacity: 0.8;
            filter: drop-shadow(0 0 8px var(--vscode-focusBorder)) drop-shadow(0 0 4px var(--vscode-focusBorder));
        }

        .rectangle-selection {
            position: absolute;
            border: 2px dashed var(--vscode-focusBorder);
            background-color: rgba(0, 123, 255, 0.1);
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <button id="viewSource" title="View source code (Ctrl+T)">View Source</button>
        <div class="separator"></div>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out">-</button>
        <button id="zoomReset" title="Fit to window">Fit</button>
        <button id="zoomActual" title="Actual size (100%)">1:1</button>
        <div class="separator"></div>
        <span id="zoomLevel" style="padding: 0 8px; font-size: 12px;">100%</span>
        <span id="selectionCounter" style="padding: 0 8px; font-size: 12px; display: none;"></span>
        <button id="reloadButton" title="Reload SVG">Reload</button>
        <div class="separator"></div>
        <button id="toggleJourney" title="Show Journeys sidebar">Journeys</button>
    </div>
    <div class="content-area">
        <div class="preview-container active" id="previewContainer">
            <div class="svg-wrapper" id="svgWrapper">
                $$$___SVG___$$$
            </div>
            <div class="rectangle-selection" id="rectangleSelection" style="display: none;"></div>
        </div>
        <div class="source-container" id="sourceContainer">
            <pre class="source-code" id="sourceCode">$$$___SOURCE_CODE___$$$</pre>
        </div>
    </div>
    <div class="input-container" id="inputContainer">
        <textarea id="journeyInput" placeholder="Enter rename/comment text..." rows="3"></textarea>
    </div>
    <div class="journey-sidebar" id="journeySidebar">
        <div class="journey-header">
            <span class="journey-header-title">Journeys (<span id="journeyCount">0</span>)</span>
            <div class="journey-header-buttons">
                <button class="journey-header-button" id="clipboardButton">clipboard</button>
                <button class="journey-header-button" id="resetButton">reset</button>
            </div>
        </div>
        <div class="journey-list" id="journeyList"></div>
    </div>
    <script>
        const vscode = acquireVsCodeApi();

        // View state
        let viewMode = 'preview'; // 'preview' or 'source'
        let zoom = 1.0;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;
        let panStartPanX = 0;
        let panStartPanY = 0;
        let hasPanned = false; // Track if mouse moved during pan operation

        const previewContainer = document.getElementById('previewContainer');
        const sourceContainer = document.getElementById('sourceContainer');
        const svgWrapper = document.getElementById('svgWrapper');
        const viewSourceBtn = document.getElementById('viewSource');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomResetBtn = document.getElementById('zoomReset');
        const zoomActualBtn = document.getElementById('zoomActual');
        const zoomLevelSpan = document.getElementById('zoomLevel');

        // Journey system elements
        const inputContainer = document.getElementById('inputContainer');
        const journeyInput = document.getElementById('journeyInput');
        const journeySidebar = document.getElementById('journeySidebar');
        const journeyList = document.getElementById('journeyList');
        const journeyCount = document.getElementById('journeyCount');
        const clipboardButton = document.getElementById('clipboardButton');
        const resetButton = document.getElementById('resetButton');
        const selectionCounter = document.getElementById('selectionCounter');
        const reloadButton = document.getElementById('reloadButton');
        const toggleJourneyBtn = document.getElementById('toggleJourney');
        const rectangleSelection = document.getElementById('rectangleSelection');

        // Journey sidebar toggle
        let journeySidebarOpen = false;

        function setJourneySidebarOpen(open) {
            journeySidebarOpen = open;
            const contentArea = document.querySelector('.content-area');
            if (open) {
                journeySidebar.classList.remove('collapsed');
                contentArea.classList.remove('journey-hidden');
                contentArea.classList.add('journey-open');
                toggleJourneyBtn.classList.add('journey-open');
                toggleJourneyBtn.title = 'Hide Journeys sidebar';
            } else {
                journeySidebar.classList.add('collapsed');
                contentArea.classList.add('journey-hidden');
                contentArea.classList.remove('journey-open');
                toggleJourneyBtn.classList.remove('journey-open');
                toggleJourneyBtn.title = 'Show Journeys sidebar';
            }
        }

        // Start collapsed — sidebar hidden by default
        setJourneySidebarOpen(false);

        toggleJourneyBtn.addEventListener('click', () => setJourneySidebarOpen(!journeySidebarOpen));

        // Selection-based state management
        const selectionState = {
            selectedElements: [], // Array of {uid, lineNumber, element}
            isCreatingNode: false,
            isRectangleSelecting: false,
            rectangleStart: { x: 0, y: 0 },
            rectangleCurrent: { x: 0, y: 0 },
            journeys: [],

            // Helper function to determine uid for an element
            getUidForElement(element) {
                const sourceLine = element.dataset.sourceLine;
                const lineNumber = sourceLine !== undefined ? parseInt(sourceLine, 10) : null;

                // For nodes: use data-entity if exists, else fallback to _{lineNumber}_
                const entity = element.dataset.entity;
                if (entity) {
                    return entity;
                }

                // For edges: construct from data-entity-1 and data-entity-2 if both exist
                const entity1 = element.dataset.entity1;
                const entity2 = element.dataset.entity2;
                if (entity1 && entity2) {
                    return `${entity1}->${entity2}`;
                }

                // Fallback: use line number as uid
                if (lineNumber !== null) {
                    return `_${lineNumber}_`;
                }

                // Last resort: use element id or empty string
                return element.id || '';
            },

            toggleSelection(element) {
                const sourceLine = element.dataset.sourceLine;
                if (sourceLine === undefined) {
                    console.warn('[Selection] Missing sourceLine for element:', element);
                    return;
                }

                const lineNumber = parseInt(sourceLine, 10);
                const uid = this.getUidForElement(element);
                const index = this.selectedElements.findIndex(e => e.uid === uid && e.lineNumber === lineNumber);
                if (index >= 0) {
                    // Deselect
                    this.unhighlightElement(this.selectedElements[index].element);
                    this.selectedElements.splice(index, 1);
                } else {
                    // Select
                    this.highlightElement(element);
                    this.selectedElements.push({ uid: uid, lineNumber: lineNumber, element: element });
                }
                this.updateSelectionCounter();
            },

            clearSelection() {
                this.selectedElements.forEach(item => {
                    this.unhighlightElement(item.element);
                });
                this.selectedElements = [];
                this.updateSelectionCounter();
            },

            selectElementsInRectangle(rect, svg) {
                // Get all <g> elements (entities, links, clusters, etc.)
                const allGroups = svg.querySelectorAll('g');
                const newSelectedElements = [];

                allGroups.forEach(group => {
                    try {
                        const bbox = group.getBBox();
                        // Check if element bounding box intersects with selection rectangle
                        if (this.rectanglesIntersect(rect, {
                            x: bbox.x,
                            y: bbox.y,
                            width: bbox.width,
                            height: bbox.height
                        })) {
                            const sourceLine = group.dataset.sourceLine;
                            if (sourceLine !== undefined) {
                                const lineNumber = parseInt(sourceLine, 10);
                                const uid = this.getUidForElement(group);
                                newSelectedElements.push({ uid: uid, lineNumber: lineNumber, element: group });
                            }
                        }
                    } catch (e) {
                        // Some elements might not have valid bounding boxes, skip them
                        console.warn('[Selection] Rectangle: error getting bbox for element', e);
                    }
                });

                // Add to existing selection (avoid duplicates)
                newSelectedElements.forEach(item => {
                    // Check if this element is already selected
                    const isAlreadySelected = this.selectedElements.some(
                        existing => existing.uid === item.uid && existing.lineNumber === item.lineNumber
                    );

                    if (!isAlreadySelected) {
                        this.highlightElement(item.element);
                        this.selectedElements.push(item);
                    }
                });
                this.updateSelectionCounter();
            },

            rectanglesIntersect(rect1, rect2) {
                return !(rect2.x > rect1.x + rect1.width ||
                    rect2.x + rect2.width < rect1.x ||
                    rect2.y > rect1.y + rect1.height ||
                    rect2.y + rect2.height < rect1.y);
            },

            highlightElement(element) {
                element.classList.add('selected');
            },

            unhighlightElement(element) {
                element.classList.remove('selected');
            },

            updateSelectionCounter() {
                const count = this.selectedElements.length;
                if (count > 0) {
                    selectionCounter.textContent = `${count} element${count !== 1 ? 's' : ''} selected`;
                    selectionCounter.style.display = 'inline';
                } else {
                    selectionCounter.style.display = 'none';
                }
            },

            reset() {
                this.clearSelection();
                this.isCreatingNode = false;
                this.isRectangleSelecting = false;
                inputContainer.classList.remove('visible');
                journeyInput.value = '';
            },

            addJourney(journey) {
                this.journeys.push(journey);
                this.updateJourneyList();
            },

            removeJourney(index) {
                this.journeys.splice(index, 1);
                this.updateJourneyList();
            },

            updateJourneyList() {
                journeyList.innerHTML = '';
                journeyCount.textContent = this.journeys.length;

                this.journeys.forEach((journey, index) => {
                    const item = document.createElement('div');
                    item.className = 'journey-item';

                    const text = document.createElement('div');
                    text.className = 'journey-text';
                    text.textContent = journey;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'journey-delete';
                    deleteBtn.textContent = '×';
                    deleteBtn.title = 'Delete journey';
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectionState.removeJourney(index);
                    });

                    item.appendChild(text);
                    item.appendChild(deleteBtn);
                    journeyList.appendChild(item);
                });
            },

            copyToClipboard() {
                if (this.journeys.length === 0) {
                    return;
                }
                const text = this.journeys.join('\n\n');
                vscode.postMessage({ type: 'copyJourneysToClipboard', text });
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const svg = document.querySelector('svg');
            if (!svg) return;

            // Initialize to 1:1 centered
            initializeZoom();

            // Setup click handlers for entities (toggle selection)
            setupClickHandlers(svg);

            // Setup clipboard button
            clipboardButton.addEventListener('click', () => {
                selectionState.copyToClipboard();
            });

            // Setup reset button
            resetButton.addEventListener('click', () => {
                selectionState.journeys = [];
                selectionState.updateJourneyList();
            });

            // Setup reload button
            reloadButton.addEventListener('click', () => {
                vscode.postMessage({ type: 'reload' });
            });

            // Setup CTRL+CLICK for creating node
            previewContainer.addEventListener('click', (e) => {
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !isPanning && !hasPanned) {
                    e.preventDefault();
                    e.stopPropagation();
                    selectionState.isCreatingNode = true;
                    inputContainer.classList.add('visible');
                    journeyInput.value = '';
                    journeyInput.focus();
                }
            });

            // Setup Shift+Drag for rectangle selection
            let rectangleStartX = 0;
            let rectangleStartY = 0;
            let isRectangleDragging = false;

            previewContainer.addEventListener('mousedown', (e) => {
                if (e.shiftKey && e.button === 0 && !e.ctrlKey && !e.metaKey) {
                    isRectangleDragging = true;
                    selectionState.isRectangleSelecting = true;
                    const rect = previewContainer.getBoundingClientRect();
                    rectangleStartX = e.clientX - rect.left;
                    rectangleStartY = e.clientY - rect.top;
                    selectionState.rectangleStart = { x: rectangleStartX, y: rectangleStartY };
                    rectangleSelection.style.display = 'block';
                    rectangleSelection.style.left = rectangleStartX + 'px';
                    rectangleSelection.style.top = rectangleStartY + 'px';
                    rectangleSelection.style.width = '0px';
                    rectangleSelection.style.height = '0px';
                    e.preventDefault();
                    e.stopPropagation();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (isRectangleDragging) {
                    const rect = previewContainer.getBoundingClientRect();
                    const currentX = e.clientX - rect.left;
                    const currentY = e.clientY - rect.top;

                    const left = Math.min(rectangleStartX, currentX);
                    const top = Math.min(rectangleStartY, currentY);
                    const width = Math.abs(currentX - rectangleStartX);
                    const height = Math.abs(currentY - rectangleStartY);

                    rectangleSelection.style.left = left + 'px';
                    rectangleSelection.style.top = top + 'px';
                    rectangleSelection.style.width = width + 'px';
                    rectangleSelection.style.height = height + 'px';
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (isRectangleDragging) {
                    isRectangleDragging = false;
                    const rect = previewContainer.getBoundingClientRect();
                    const endX = e.clientX - rect.left;
                    const endY = e.clientY - rect.top;

                    const selectionRect = {
                        x: Math.min(rectangleStartX, endX),
                        y: Math.min(rectangleStartY, endY),
                        width: Math.abs(endX - rectangleStartX),
                        height: Math.abs(endY - rectangleStartY)
                    };

                    // Convert screen coordinates to SVG coordinates
                    // Account for pan and zoom transform
                    const svgX = (selectionRect.x - panX) / zoom;
                    const svgY = (selectionRect.y - panY) / zoom;
                    const svgWidth = selectionRect.width / zoom;
                    const svgHeight = selectionRect.height / zoom;

                    selectionState.selectElementsInRectangle({
                        x: svgX,
                        y: svgY,
                        width: svgWidth,
                        height: svgHeight
                    }, svg);

                    rectangleSelection.style.display = 'none';
                    selectionState.isRectangleSelecting = false;
                }
            });

            // Setup input field handlers
            journeyInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const text = journeyInput.value.trim();

                    if (selectionState.isCreatingNode) {
                        // Create node journey
                        if (text) {
                            selectionState.addJourney(`<Create Node>: ${text}`);
                        }
                        selectionState.isCreatingNode = false;
                        selectionState.reset();
                    } else if (selectionState.selectedElements.length > 0) {
                        // Comment/action on selected elements
                        if (text) {
                            const entityRefs = [];
                            // Format: {uid}:{lineNumber+1} (1-indexed line number)
                            selectionState.selectedElements.forEach(e => {
                                entityRefs.push(`${e.uid}:${e.lineNumber + 1}`);
                            });
                            selectionState.addJourney(`<About Entities(${entityRefs.join(', ')})>:${text}`);
                        }
                        selectionState.reset();
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    selectionState.reset();
                }
                // Shift+Enter allows newline (default behavior)
            });

            // Show input when user starts typing while nodes/edges are selected
            document.addEventListener('keydown', (e) => {
                if (selectionState.selectedElements.length > 0 && !selectionState.isCreatingNode &&
                    !e.ctrlKey && !e.metaKey && !e.altKey) {
                    // Show input if it's a printable character
                    const isPrintable = e.key.length === 1 &&
                        e.key !== 'Escape' &&
                        e.key !== 'Enter' &&
                        !e.key.startsWith('Arrow') &&
                        !e.key.startsWith('F') &&
                        e.key !== 'Tab';

                    if (isPrintable) {
                        if (!inputContainer.classList.contains('visible')) {
                            inputContainer.classList.add('visible');
                            journeyInput.focus();
                        }
                    }
                }
            });

            // Setup ESC key handler for canceling
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    // Only cancel if input is not focused (to allow ESC in input)
                    if (document.activeElement !== journeyInput) {
                        selectionState.reset();
                    }
                }
            });

            // Setup zoom controls
            zoomInBtn.addEventListener('click', () => zoomTo(zoom * 1.2));
            zoomOutBtn.addEventListener('click', () => zoomTo(zoom / 1.2));
            zoomResetBtn.addEventListener('click', fitToWindow);
            zoomActualBtn.addEventListener('click', () => centerAt1x1());

            // Setup view source button
            viewSourceBtn.addEventListener('click', viewSource);

            // Setup mouse wheel zoom (works with regular scroll or Ctrl/Cmd+scroll)
            previewContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                // Zoom rate: 5% change per scroll
                const delta = e.deltaY > 0 ? 0.95 : 1.05;
                const rect = previewContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Apply zoom immediately
                zoomAtPoint(x, y, delta);
            }, { passive: false });

            // Setup panning
            previewContainer.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                    isPanning = true;
                    hasPanned = false;
                    panStartX = e.clientX;
                    panStartY = e.clientY;
                    panStartPanX = panX;
                    panStartPanY = panY;
                    previewContainer.classList.add('panning');
                    e.preventDefault();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    const deltaX = Math.abs(e.clientX - panStartX);
                    const deltaY = Math.abs(e.clientY - panStartY);
                    // Consider it a pan if mouse moved more than 3 pixels
                    if (deltaX > 3 || deltaY > 3) {
                        hasPanned = true;
                    }
                    panX = panStartPanX + (e.clientX - panStartX);
                    panY = panStartPanY + (e.clientY - panStartY);
                    updateTransform();
                }
            });

            document.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    previewContainer.classList.remove('panning');
                    // Reset hasPanned after click events have been processed
                    // Use requestAnimationFrame to ensure click handlers run first
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            hasPanned = false;
                        });
                    });
                }
            });

            // Keyboard shortcut for view source (Ctrl+T / Cmd+T)
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 't' && !e.shiftKey) {
                    e.preventDefault();
                    viewSource();
                }
            });
        });

        function initializeZoom() {
            const svg = document.querySelector('svg');
            if (!svg) return;

            const container = previewContainer;
            const containerRect = container.getBoundingClientRect();

            // Temporarily reset transform to get accurate SVG dimensions
            const savedTransform = svgWrapper.style.transform;
            svgWrapper.style.transform = 'translate(0, 0) scale(1)';

            // Force a reflow to ensure dimensions are accurate
            void svg.offsetHeight;

            // Get SVG dimensions
            const svgRect = svg.getBoundingClientRect();
            const svgWidth = svgRect.width;
            const svgHeight = svgRect.height;

            // Restore transform
            svgWrapper.style.transform = savedTransform;

            if (svgWidth === 0 || svgHeight === 0) {
                console.warn('Cannot initialize: SVG has zero dimensions');
                return;
            }

            // Set to 1:1 and center
            zoom = 1.0;
            panX = (containerRect.width - svgWidth) / 2;
            panY = (containerRect.height - svgHeight) / 2;
            updateTransform();
        }

        function centerAt1x1() {
            const svg = document.querySelector('svg');
            if (!svg) return;

            const container = previewContainer;
            const containerRect = container.getBoundingClientRect();

            // Temporarily reset transform to get accurate SVG dimensions
            const savedTransform = svgWrapper.style.transform;
            svgWrapper.style.transform = 'translate(0, 0) scale(1)';

            // Force a reflow to ensure dimensions are accurate
            void svg.offsetHeight;

            // Get SVG dimensions
            const svgRect = svg.getBoundingClientRect();
            const svgWidth = svgRect.width;
            const svgHeight = svgRect.height;

            // Restore transform
            svgWrapper.style.transform = savedTransform;

            if (svgWidth === 0 || svgHeight === 0) {
                console.warn('Cannot center: SVG has zero dimensions');
                return;
            }

            // Set to 1:1 and center
            zoom = 1.0;
            panX = (containerRect.width - svgWidth) / 2;
            panY = (containerRect.height - svgHeight) / 2;
            updateTransform();
        }

        function fitToWindow() {
            const svg = document.querySelector('svg');
            if (!svg) return;

            const container = previewContainer;
            const containerRect = container.getBoundingClientRect();

            // Temporarily reset transform to get accurate SVG dimensions
            const savedTransform = svgWrapper.style.transform;
            svgWrapper.style.transform = 'translate(0, 0) scale(1)';

            // Force a reflow to ensure dimensions are accurate
            void svg.offsetHeight;

            // Get SVG dimensions
            const svgRect = svg.getBoundingClientRect();
            const svgWidth = svgRect.width;
            const svgHeight = svgRect.height;

            // Restore transform
            svgWrapper.style.transform = savedTransform;

            if (svgWidth === 0 || svgHeight === 0) {
                console.warn('Cannot fit: SVG has zero dimensions');
                return;
            }

            const padding = 40;
            const scaleX = (containerRect.width - padding) / svgWidth;
            const scaleY = (containerRect.height - padding) / svgHeight;
            const newZoom = Math.min(scaleX, scaleY, 1.0);

            zoom = newZoom;
            // Center the SVG in the container
            panX = (containerRect.width - svgWidth * zoom) / 2;
            panY = (containerRect.height - svgHeight * zoom) / 2;
            updateTransform();
        }

        function zoomTo(newZoom) {
            zoom = Math.max(0.1, Math.min(5.0, newZoom));
            updateTransform();
        }

        function zoomAtPoint(x, y, factor) {
            const svg = document.querySelector('svg');
            if (!svg) return;

            // x, y are relative to the container (previewContainer)
            // We need to convert these to SVG local coordinates

            // Get the current SVG position in screen coordinates
            // The transform is: translate(panX, panY) scale(zoom)
            // So a point (svgX, svgY) in SVG coordinates becomes:
            // screenX = panX + svgX * zoom
            // screenY = panY + svgY * zoom

            // Reverse this to get SVG coordinates from screen coordinates:
            // svgX = (screenX - panX) / zoom
            // svgY = (screenY - panY) / zoom

            const svgX = (x - panX) / zoom;
            const svgY = (y - panY) / zoom;

            // Calculate new zoom
            const newZoom = Math.max(0.1, Math.min(5.0, zoom * factor));

            // Calculate new pan so the same SVG point stays under the cursor
            // screenX = newPanX + svgX * newZoom
            // newPanX = screenX - svgX * newZoom
            panX = x - svgX * newZoom;
            panY = y - svgY * newZoom;

            zoom = newZoom;
            updateTransform();
        }

        function updateTransform() {
            // Use transform-origin center for better centering behavior
            svgWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
            zoomLevelSpan.textContent = Math.round(zoom * 100) + '%';
        }

        function viewSource() {
            // Switch to viewing the source file in the editor
            vscode.postMessage({ type: 'viewSource' });
        }

        function setupClickHandlers(svg) {
            // Click handler for all <g> elements - toggle selection
            const allGroups = svg.querySelectorAll('g');
            console.log('[Selection] Setting up click handlers for', allGroups.length, 'elements');

            allGroups.forEach(g => {
                g.addEventListener('click', (e) => {
                    // Don't select if we were panning/dragging
                    if (isPanning || hasPanned) {
                        return;
                    }

                    // Handle CTRL+CLICK for creating node
                    if (e.ctrlKey || e.metaKey) {
                        e.stopPropagation();
                        selectionState.isCreatingNode = true;
                        inputContainer.classList.add('visible');
                        journeyInput.value = '';
                        journeyInput.focus();
                        return;
                    }

                    // Don't toggle if shift key (used for rectangle selection)
                    if (e.shiftKey) {
                        return;
                    }

                    e.stopPropagation();
                    selectionState.toggleSelection(g);
                });
            });
            console.log('[Selection] Finished setting up click handlers');
        }
    </script>
